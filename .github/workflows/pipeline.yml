name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: orders-api
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  REPORTS: reports

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: hashFiles('terraform/**/*.tf') != ''
      - name: terraform fmt and validate
        if: hashFiles('terraform/**/*.tf') != ''
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        run: |
          mkdir -p "$REPORTS"
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.182.0 \
            semgrep scan --metrics=off --error \
              --config p/owasp-top-ten --config p/nodejs --config p/secrets \
              --json-output="$REPORTS"/semgrep.json app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-report
          path: reports/

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy fs (dependencies from the lockfile)
        run: |
          mkdir -p "$REPORTS"
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs --quiet \
            --scanners vuln --format table --output "$REPORTS"/sca.txt app
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs --quiet \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sca-report
          path: reports/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: gitleaks (full git history)
        run: |
          mkdir -p "$REPORTS"
          ./gitleaks git . --redact --no-banner \
            --report-format json --report-path "$REPORTS"/gitleaks.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secrets-report
          path: reports/

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: checkov (terraform + dockerfile)
        run: |
          mkdir -p "$REPORTS"
          docker run --rm -v "$PWD:/src" -w /src bridgecrew/checkov:3.3.30 \
            --config-file .checkov.yaml -d . --framework terraform dockerfile \
            --output cli --output junitxml --output-file-path "console,$REPORTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iac-report
          path: reports/

  build:
    needs: [validate, sast, sca, secrets, iac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          docker build -t "$IMAGE:${{ github.sha }}" app
          docker save "$IMAGE:${{ github.sha }}" -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  container-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: full report
        run: |
          mkdir -p "$REPORTS"
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" image --quiet --input image.tar \
            --scanners vuln,secret --image-config-scanners misconfig,secret \
            --ignorefile .trivyignore.yaml --format table --output "$REPORTS"/trivy-image.txt
      - name: "gate: any Critical"
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" image --quiet --input image.tar \
            --scanners vuln,secret --ignorefile .trivyignore.yaml \
            --severity CRITICAL --exit-code 1
      - name: "gate: High with a fix available"
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" image --quiet --input image.tar \
            --scanners vuln --ignorefile .trivyignore.yaml \
            --severity HIGH --ignore-unfixed --exit-code 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-scan-report
          path: reports/

  dast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: start the app on an isolated network
        run: |
          docker load -i image.tar
          docker network create dast
          docker run -d --name app --network dast -e DB_PASSWORD=dast-dummy "$IMAGE:${{ github.sha }}"
      - name: zap baseline
        run: |
          mkdir -p "$REPORTS" && chmod 777 "$REPORTS"
          docker run --rm --network dast -v "$PWD/$REPORTS:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://app:8080/api/orders/1 -r zap.html -J zap.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dast-report
          path: reports/

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container-scan, dast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push the exact image that was scanned
        id: push
        run: |
          docker load -i image.tar
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" "$REF"
          docker push "$REF"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$REF")" >> "$GITHUB_OUTPUT"

  deploy-staging:
    needs: [publish]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REPO: ${{ vars.ECR_REPOSITORY }}
      CLUSTER: orders-staging
      SERVICE: orders-api
      TASK_FAMILY: orders-api-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: skip when no AWS account is wired to this environment
        if: env.ROLE_ARN == ''
        run: echo "No AWS role configured for staging; image ${{ github.sha }} passed every gate and would deploy here."
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.ROLE_ARN != ''
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ap-southeast-3
      - name: push the scanned image to ECR and roll the service
        if: env.ROLE_ARN != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"
          docker pull "${{ needs.publish.outputs.image }}"
          IMAGE_URI="$ECR_REPO:${{ github.sha }}"
          docker tag "${{ needs.publish.outputs.image }}" "$IMAGE_URI"
          docker push "$IMAGE_URI"
          IMAGE_URI="$IMAGE_URI" ./scripts/deploy-ecs.sh

  deploy-production:
    needs: [publish, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REPO: ${{ vars.ECR_REPOSITORY }}
      CLUSTER: orders-production
      SERVICE: orders-api
      TASK_FAMILY: orders-api-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: skip when no AWS account is wired to this environment
        if: env.ROLE_ARN == ''
        run: echo "No AWS role configured for production; image ${{ github.sha }} passed every gate and would deploy here."
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.ROLE_ARN != ''
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ap-southeast-3
      - name: push the scanned image to ECR and roll the service
        if: env.ROLE_ARN != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"
          docker pull "${{ needs.publish.outputs.image }}"
          IMAGE_URI="$ECR_REPO:${{ github.sha }}"
          docker tag "${{ needs.publish.outputs.image }}" "$IMAGE_URI"
          docker push "$IMAGE_URI"
          IMAGE_URI="$IMAGE_URI" ./scripts/deploy-ecs.sh
